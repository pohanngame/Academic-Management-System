server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: academic-profile-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/academic_profile?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:academic_profile_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:512MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:513MB}
      location: ${APP_TEMP_DIR:./data/temp/academic-profile}
  mvc:
    async:
      request-timeout: ${APP_BACKUP_DOWNLOAD_TIMEOUT:15m}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  files:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    export-dir: ${APP_EXPORT_DIR:./data/exports}
    temp-dir: ${APP_TEMP_DIR:./data/temp/academic-profile}
    max-upload-size: ${APP_MAX_UPLOAD_SIZE:10MB}
    encryption-key-file: ${FILE_ENCRYPTION_KEY_FILE:./data/secrets/file-encryption.key}
    migration-enabled: ${FILE_ENCRYPTION_MIGRATION_ENABLED:false}
  security:
    jwt-secret: ${APP_JWT_SECRET:change-me-in-environment}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  admin-bootstrap:
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
    action: ${APP_ADMIN_BOOTSTRAP_ACTION:}
    username: ${APP_ADMIN_BOOTSTRAP_USERNAME:}
    email: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
    password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${APP_ADMIN_BOOTSTRAP_DISPLAY_NAME:}
  backup:
    dump-timeout: ${APP_BACKUP_DUMP_TIMEOUT:10m}
    minimum-free-bytes: ${APP_BACKUP_MINIMUM_FREE_BYTES:104857600}
    maximum-download-bytes: ${APP_BACKUP_MAXIMUM_DOWNLOAD_BYTES:536870912}
    application-version: ${APP_VERSION:unknown}
    git-commit: ${APP_GIT_COMMIT:unknown}
    mysqldump-executable: ${APP_MYSQLDUMP_EXECUTABLE:mysqldump}
  restore:
    inbox-dir: ${APP_RESTORE_INBOX_DIR:./data/restore-inbox}
    max-upload-bytes: ${APP_RESTORE_MAX_UPLOAD_BYTES:536870912}
    staged-ttl: ${APP_RESTORE_STAGED_TTL:24h}
  publication:
    ccf:
      max-upload-bytes: ${APP_CCF_MAX_UPLOAD_BYTES:5242880}
      enforce-expected-sha256: ${APP_CCF_ENFORCE_EXPECTED_SHA256:true}
  ai:
    max-tokens: ${AI_MAX_TOKENS:1024}
    max-prompt-chars: ${AI_MAX_PROMPT_CHARS:30000}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:10}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    encryption-key-file: ${AI_ENCRYPTION_KEY_FILE:./data/secrets/ai-config.key}
  timetable:
    enabled: ${TIMETABLE_SYNC_ENABLED:true}
    auth-base-url: ${TIMETABLE_AUTH_BASE_URL:https://authserver.dgpt.edu.cn}
    jw-base-url: ${TIMETABLE_JW_BASE_URL:https://jw.dgpt.edu.cn}
    timeout-seconds: ${TIMETABLE_TIMEOUT_SECONDS:30}
  document-conversion:
    enabled: ${DOCUMENT_CONVERSION_ENABLED:false}
    base-url: ${DOCUMENT_CONVERSION_BASE_URL:http://127.0.0.1:3000}
    connect-timeout-seconds: ${DOCUMENT_CONVERSION_CONNECT_TIMEOUT_SECONDS:5}
    timeout-seconds: ${DOCUMENT_CONVERSION_TIMEOUT_SECONDS:70}
    max-input-size: ${DOCUMENT_CONVERSION_MAX_INPUT_SIZE:15MB}
    max-output-size: ${DOCUMENT_CONVERSION_MAX_OUTPUT_SIZE:20MB}
  ocr:
    enabled: ${OCR_ENABLED:false}
    base-url: ${OCR_BASE_URL:http://127.0.0.1:8866}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:60}
    min-pdf-text-length: ${OCR_MIN_PDF_TEXT_LENGTH:80}
    staging-ttl-hours: ${OCR_STAGING_TTL_HOURS:24}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
