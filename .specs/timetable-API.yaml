openapi: 3.0.3
info:
  title: 课表公共空闲增量
  version: "17"
  description: >
    全部接口要求登录本系统。同步请求中的教务登录态只在该次请求使用，
    响应、日志和数据库都不得回显。
paths:
  /api/admin/timetable/teacher-links:
    get:
      summary: 列出教务显示名映射
    post:
      summary: 按 sourceName 新增或覆盖映射
      description: >
        同名同教师重复提交只更新原记录。
        同名换教师时覆盖该姓名的 teacherId。
        该教师已经绑定另一个 sourceName 时返回 409，不自动迁移；先删除旧映射再新增。
        教师不存在返回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceName, teacherId]
              properties:
                sourceName: { type: string, maxLength: 128 }
                teacherId: { type: integer, format: int64 }
    delete:
      summary: 按 sourceName 删除映射
      parameters:
        - in: query
          name: sourceName
          required: true
          schema: { type: string }
  /api/timetable/sync/captcha:
    post:
      summary: 开始一次教务同步并返回验证码
      description: >
        后端临时保存认证页会话、pwdEncryptSalt、lt、execution。
        先调 /authserver/checkNeedCaptcha.htl；需要验证时调 /authserver/common/openSliderCaptcha.htl，不取 getCaptcha.htl。
        不需要则 captchaRequired=false、sliderRequired=false，不返回图片。临时会话不得写入业务库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200":
          description: attemptId、captchaRequired、captchaImageBase64、sliderRequired、sliderBackgroundBase64、sliderPieceBase64。
  /api/timetable/sync:
    post:
      summary: 用同一次尝试完成登录并同步一个学期
      description: >
        密码按认证页规则加密：64 位随机前缀加密文，
        AES/CBC/PKCS7，密钥为 pwdEncryptSalt，向量为 16 位随机串。
        随机串字符集为 ABCDEFGHJKMNPQRSTWXYZabcdefhijkmnprstwxyz2345678。向量只参与加密，不单独提交。
        lt 与 execution 只取含 pwdEncryptSalt 的账号登录表单。
        登录提交 password 为加密结果。密码框在提交前被禁用，所以不提交 passwordText，也不提交原始密码。
        需要滑块时，先把 canvasLength、moveLength、tracks 的加密结果以 sign 字段提交到 /authserver/common/verifySliderCaptcha.htl；errorCode 为 1 才继续登录。每个轨迹点只含 a、b、c：a 是水平位移，b 是纵向位移，c 是相对上一个点的毫秒数；不得使用 x、y、t。
        教务基址为 https://jw.dgpt.edu.cn。门户登录提交后手工跟随跳转并收集每一跳 Cookie。统一认证跳回带 ticket 的 sso.jsp 时不能停止，必须继续访问该地址，直到教务页面不再跳转。HTTP 跳转和页面脚本跳转都要跟随。Cookie 按响应头 Domain 归属；没有 Domain 时按当前主机和 Path 归属。host-only Cookie 只发给该主机，不能因为同名父域 Cookie 被覆盖。访问教务时必须同时保留认证站的 host-only Cookie 和 .dgpt.edu.cn 的 Cookie。再用对应域名的 Cookie GET kbxx_teacher；最终页面没有 #kbjcmsid 时返回登录失败。不能用 sso.jsp 最终 HTML 是否含有 xsMain 判断成功。成功后 POST kbxx_teacher_ifr。
        kbjcmsid 用总表页已选项；没有 selected 且只有一个选项时用该选项；多个选项都没有 selected 时报错。zc1=1，zc2=30；星期和节次参数留空。
        同一 semesterCode 再次同步替换旧批次。
        未映射教师不入库，响应返回 unmappedNames；已映射单元格仍保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, semesterCode, password]
              properties:
                sliderMove: { type: number }
                sliderCanvasWidth: { type: number }
                sliderTracks:
                  type: array
                  items:
                    type: object
                    required: [a, b, c]
                    properties:
                      a: { type: number }
                      b: { type: number }
                      c: { type: number }
              properties:
                attemptId: { type: string }
                semesterCode: { type: string, example: 2026-2027-1 }
                password: { type: string }
                captcha: { type: string }
      responses:
        "200":
          description: batchId、已保存教师数、单元格数、unmappedNames。不得返回登录态。
  /api/timetable/common-free:
    get:
      summary: 查询公共空闲
      parameters:
        - { in: query, name: semesterCode, required: true, schema: { type: string } }
        - { in: query, name: week, required: true, schema: { type: integer, minimum: 1, maximum: 30 } }
        - { in: query, name: majorId, schema: { type: integer, format: int64 } }
        - { in: query, name: teacherIds, schema: { type: string }, description: 逗号分隔的 teacher_profile.id }
      responses:
        "200":
          description: >
            majorId 与 teacherIds 必须二选一。slots 固定 42 项。
            无批次时 missingImport=true，slots 仍返回 42 项且 free=false。
            专业范围包含该专业全部教师。没有课表映射的教师列入 excludedTeachers，reason=NO_TIMETABLE_MAPPING。
            已映射但本学期总表没有该教师时也列入 excludedTeachers，reason=ABSENT_FROM_IMPORT。
            两种排除对象都不参与空闲判断。指定 teacherIds 时，教师不存在返回 404。
  /api/timetable/common-free/excel:
    get:
      summary: 导出当前查询的 Excel
      parameters:
        - { in: query, name: semesterCode, required: true, schema: { type: string } }
        - { in: query, name: week, required: true, schema: { type: integer } }
        - { in: query, name: majorId, schema: { type: integer, format: int64 } }
        - { in: query, name: teacherIds, schema: { type: string } }
  /api/ai/modules:
    get:
      summary: 既有模块追加 timetableOccupancy
      description: 生成请求额外带 timetableQuery。只取本次查询结果。
servers:
  - url: /
